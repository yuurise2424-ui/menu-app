<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="メニュー案内">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgZmlsbD0iIzE0MTQxNCIvPjx0ZXh0IHg9Ijk2IiB5PSI4MiIgZm9udC1zaXplPSI2MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZmZmZiI+5p2OPC90ZXh0Pjx0ZXh0IHg9Ijk2IiB5PSIxNTAiIGZvbnQtc2l6ZT0iNjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmZmZmZmYiPuaYhzwvdGV4dD48L3N2Zz4=">

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.json">

    <title>メニュー案内</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            background: #000;
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            overflow: hidden;
            overscroll-behavior-y: none;
        }

        #app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #141414;
            color: #eee;
            width: 100%;
        }

        .header {
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            border-bottom: 1px solid #333;
            background: #0a0a0a;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none; border: none; color: #aaa;
            font-size: 24px; cursor: pointer;
            padding: 0 8px; display: none; line-height: 1;
        }
        .back-btn.visible { display: block; }

        .header-title {
            flex: 1; font-size: 16px; font-weight: bold;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            text-align: center;
        }

        .offline-badge {
            font-size: 10px; background: #e74c3c; color: #fff;
            padding: 2px 6px; border-radius: 4px; display: none;
            margin-left: 8px; font-weight: normal;
        }
        .offline-badge.visible { display: inline-block; }

        .list-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            overscroll-behavior: contain;
        }

        /* トップ選択画面 */
        .mode-select {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 24px 0;
        }

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .mode-btn {
            background: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 28px 16px;
            color: #eee;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.05em;
            width: 100%;
        }
        .mode-btn:active { background: #2e2e2e; }

        /* リスト */
        .list-item {
            border-bottom: 1px solid #333;
            padding: 16px 0;
            cursor: pointer;
        }
        .list-item:last-child { border-bottom: none; }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-size: 16px; font-weight: bold; flex: 1; line-height: 1.4; }
        .item-price { font-size: 15px; color: #f5a623; margin-left: 12px; white-space: nowrap; }
        .arrow { color: #666; font-size: 18px; margin-left: 12px; flex-shrink: 0; }

        .item-details {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #222;
            border-radius: 8px;
            font-size: 14px;
        }
        .list-item.open .item-details { display: block; }

        .field { margin-bottom: 10px; }
        .field:last-child { margin-bottom: 0; }
        .field-label { font-size: 12px; color: #888; margin-bottom: 4px; }
        .field-value { color: #ddd; line-height: 1.5; }

        .field-value.alert-text { color: #ff6b6b; font-weight: bold; }
        .field-value.guide-text { color: #8bd3e6; }
        .field-value.condiment-text { color: #f9d71c; }

        /* 画像・動画 */
        .item-image {
            width: 100%;
            max-height: 360px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
            background: #111;
        }

        /* 動画サムネイル（タップ前） */
        .video-thumb {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-top: 4px;
            border-radius: 8px;
            overflow: hidden;
            background: #0e0e0e;
            cursor: pointer;
            border: 1px solid #333;
        }
        .video-thumb-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.65;
        }
        .play-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .play-circle {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.93);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #111;
            padding-left: 4px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.6);
        }
        .play-label {
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
            letter-spacing: 0.05em;
        }
        /* 動画iframe（タップ後） */
        .video-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            margin-top: 4px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-embed {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        /* HTML5 video */
        .item-video {
            width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            display: block;
            background: #000;
            max-height: 400px;
        }

        .media-link {
            display: inline-block;
            margin-top: 6px;
            color: #8bd3e6;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border: 1px solid #8bd3e6;
            border-radius: 6px;
        }

        .status-msg { padding: 30px 20px; text-align: center; font-size: 15px; color: #888; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <button class="back-btn" id="back-btn">‹</button>
        <div class="header-title">
            <span id="header-title-text">読み込み中...</span>
            <span id="offline-badge" class="offline-badge">オフライン</span>
        </div>
        <div style="width: 40px; display: none;" id="header-spacer"></div>
    </div>

    <div class="list-container" id="item-list">
        <div class="status-msg">データを準備しています...</div>
    </div>
</div>

<script>
    const SHEET_ID   = '1yroIO2G1QG_F7J3plZYO_gdy3Y898wk6pUS3Y7lT7oU';
    const BASE       = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=`;
    const FOOD_URL   = BASE + 'フード';
    const DRINK_URL  = BASE + 'ドリンク';
    const MANUAL_URL = BASE + '接客マニュアル動画、テーブルセット';
    const OTHER_URL  = BASE + 'メニューにはないやつ';

    let foodData   = [];
    let drinkData  = [];
    let manualData = [];
    let otherData  = [];

    let currentMode = null;
    let currentCat  = '';

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // ─── Load ────────────────────────────────────────────────

    async function load() {
        const badgeEl = document.getElementById('offline-badge');

        const cacheMap = {
            food:   'menuFoodData',
            drink:  'menuDrinkData',
            manual: 'menuManualData',
            other:  'menuOtherData',
        };

        const cached = {};
        for (const [k, key] of Object.entries(cacheMap)) cached[k] = localStorage.getItem(key);

        if (cached.food)   foodData   = parseFoodCSV(cached.food);
        if (cached.drink)  drinkData  = parseDrinkCSV(cached.drink);
        if (cached.manual) manualData = parseManualCSV(cached.manual);
        if (cached.other)  otherData  = parseOtherCSV(cached.other);

        if (Object.values(cached).some(v => v)) renderCurrent();

        let networkError = false;
        const sheets = [
            { url: FOOD_URL,   key: cacheMap.food,   parse: parseFoodCSV,   set: d => foodData = d },
            { url: DRINK_URL,  key: cacheMap.drink,  parse: parseDrinkCSV,  set: d => drinkData = d },
            { url: MANUAL_URL, key: cacheMap.manual, parse: parseManualCSV, set: d => manualData = d },
            { url: OTHER_URL,  key: cacheMap.other,  parse: parseOtherCSV,  set: d => otherData = d },
        ];

        await Promise.all(sheets.map(s =>
            fetch(s.url + '&t=' + Date.now())
                .then(r => { if (!r.ok) throw new Error(); return r.text(); })
                .then(text => {
                    localStorage.setItem(s.key, text);
                    try { s.set(s.parse(text)); } catch (e) {}
                })
                .catch(() => { networkError = true; })
        ));

        if (networkError) {
            if (!Object.values(cached).some(v => v)) {
                document.getElementById('item-list').innerHTML =
                    `<div class="status-msg">通信エラー。<br>初回はWi-Fi環境で開いてください。<br><button onclick="load()" style="margin-top:15px;padding:8px 16px;border-radius:6px;border:none;background:#555;color:#fff;">再試行</button></div>`;
                document.getElementById('header-title-text').textContent = 'エラー';
                return;
            }
            badgeEl.classList.add('visible');
        } else {
            badgeEl.classList.remove('visible');
        }

        renderCurrent();
    }

    function renderCurrent() {
        if (currentMode === null)          renderTop();
        else if (currentMode === 'manual') renderManual();
        else if (currentMode === 'other')  renderOther();
        else if (currentCat === '')        renderCatsFor(currentMode);
        else                               renderItemsFor(currentMode, currentCat);
    }



    // ─── Parsers ─────────────────────────────────────────────

    function parseFoodCSV(text) {
        const rows = parseCSV(text);
        let lastCat = '';
        return rows.slice(1).map(r => {
            if (r[0]) lastCat = r[0];
            return {
                cat: lastCat, name: r[1]||'', price: r[2]||'',
                amount: r[3]||'', fat: r[4]||'', parts: r[5]||'',
                desc: r[6]||'', guide: r[7]||'', condiment: r[8]||'',
                note: r[9]||'', allergy: r[10]||'', image: r[11]||'',
            };
        }).filter(r => r.name);
    }

    function parseDrinkCSV(text) {
        const rows = parseCSV(text);
        let lastCat = '';
        return rows.slice(1).map(r => {
            if (r[0]) lastCat = r[0];
            return {
                cat: lastCat, name: r[1]||'',
                glass: r[2]||'', amount: r[3]||'', note: r[4]||'', image: r[5]||'',
            };
        }).filter(r => r.name);
    }

    function parseManualCSV(text) {
        // A=カテゴリ(項目名), B=動画・画像URL
        const rows = parseCSV(text);
        return rows.slice(1).map(r => ({
            title: r[0]||'', url: r[1]||'',
        })).filter(r => r.title);
    }

    function parseOtherCSV(text) {
        // A=メニュー, B=値段
        const rows = parseCSV(text);
        return rows.slice(1).map(r => ({
            name: r[0]||'', price: r[1]||'',
        })).filter(r => r.name);
    }

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', q = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (q) {
                if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
                else cell += c;
            } else {
                if (c === '"') q = true;
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i+1] === '\n') i++;
                    row.push(cell.trim()); rows.push(row); row = []; cell = '';
                } else cell += c;
            }
        }
        if (row.length) { row.push(cell.trim()); rows.push(row); }
        return rows;
    }

    // ─── Header ─────────────────────────────────────────────

    function setHeader(title, backFn) {
        const backBtn = document.getElementById('back-btn');
        const spacer  = document.getElementById('header-spacer');
        const titleEl = document.getElementById('header-title-text');
        titleEl.textContent = title;
        if (backFn) {
            backBtn.classList.add('visible');
            backBtn.onclick = backFn;
            spacer.style.display = 'block';
        } else {
            backBtn.classList.remove('visible');
            spacer.style.display = 'none';
        }
    }

    // ─── Top screen ─────────────────────────────────────────

    function renderTop() {
        currentMode = null;
        currentCat  = '';
        setHeader('メニュー案内', null);
        document.getElementById('item-list').innerHTML = `
            <div class="mode-select">
                <div class="mode-grid">
                    <button class="mode-btn" onclick="renderCatsFor('food')">フード</button>
                    <button class="mode-btn" onclick="renderCatsFor('drink')">ドリンク</button>
                </div>
                <button class="mode-btn" onclick="renderManual()">接客マニュアル動画・テーブルセット</button>
                <button class="mode-btn" onclick="renderOther()">メニューにはないやつ</button>
            </div>
        `;
    }

    // ─── 接客マニュアル動画（フラットリスト）───────────────

    function renderManual() {
        currentMode = 'manual';
        currentCat  = '';
        setHeader('接客マニュアル動画・テーブルセット', renderTop);

        if (manualData.length === 0) {
            document.getElementById('item-list').innerHTML = `<div class="status-msg">データがありません</div>`;
            return;
        }

        const listEl = document.getElementById('item-list');
        listEl.innerHTML = manualData.map(item => {
            const media = renderMedia(item.url);
            const hasDetails = !!(media || item.note);
            const detailsHtml = hasDetails ? `
                <div class="item-details">
                    ${media ? `<div class="field">${media}</div>` : ''}
                </div>` : '';
            return `
                <div class="list-item" onclick="if(this.querySelector('.item-details'))this.classList.toggle('open')">
                    <div class="item-header">
                        <div class="item-name">${esc(item.title)}</div>
                        ${hasDetails ? '<div class="arrow">&#8250;</div>' : ''}
                    </div>
                    ${detailsHtml}
                </div>`;
        }).join('');
        listEl.scrollTop = 0;
    }

    // ─── メニューにはないやつ（フラットリスト）──────────────

    function renderOther() {
        currentMode = 'other';
        currentCat  = '';
        setHeader('メニューにはないやつ', renderTop);

        if (otherData.length === 0) {
            document.getElementById('item-list').innerHTML = `<div class="status-msg">データがありません</div>`;
            return;
        }

        const listEl = document.getElementById('item-list');
        listEl.innerHTML = otherData.map(item => `
            <div class="list-item">
                <div class="item-header">
                    <div class="item-name">${esc(item.name)}</div>
                    ${item.price ? `<div class="item-price">${esc(item.price)}</div>` : ''}
                </div>
            </div>`
        ).join('');
        listEl.scrollTop = 0;
    }

    // ─── カテゴリ → アイテム（フード/ドリンク/テーブルセット）

    function getModeLabel(mode) {
        return { food: 'フード', drink: 'ドリンク' }[mode] || mode;
    }

    function getDataFor(mode) {
        return { food: foodData, drink: drinkData }[mode] || [];
    }

    function renderCatsFor(mode) {
        currentMode = mode;
        currentCat  = '';
        setHeader(getModeLabel(mode), renderTop);

        const data = getDataFor(mode);
        const seen = new Set();
        const cats = data.map(r => r.cat).filter(c => c && !seen.has(c) && seen.add(c));

        if (cats.length === 0) {
            document.getElementById('item-list').innerHTML = `<div class="status-msg">データがありません</div>`;
            return;
        }

        window._cats = cats;

        document.getElementById('item-list').innerHTML = cats.map((cat, i) => `
            <div class="list-item" onclick="renderItemsFor('${mode}',${i})">
                <div class="item-header">
                    <div class="item-name">${esc(cat)}</div>
                    <div class="arrow">&#8250;</div>
                </div>
            </div>
        `).join('');
        document.getElementById('item-list').scrollTop = 0;
    }

    function renderItemsFor(mode, catIdx) {
        const cat = (window._cats || [])[catIdx];
        if (cat === undefined) return;
        currentCat = cat;

        const data  = getDataFor(mode);
        const items = data.filter(r => r.cat === cat);

        setHeader(cat, () => renderCatsFor(mode));

        const listEl = document.getElementById('item-list');

        listEl.innerHTML = items.map(item => {
            let fields = [];

            if (mode === 'food') {
                fields = [
                    { label: '枚数/グラム', val: item.amount,    cls: '' },
                    { label: '脂の量',               val: item.fat,       cls: '' },
                    { label: '材料/部位',        val: item.parts,     cls: '' },
                    { label: '説明',                     val: item.desc,      cls: '' },
                    { label: '接客時の説明', val: item.guide, cls: 'guide-text' },
                    { label: '付けるもの',   val: item.condiment, cls: 'condiment-text' },
                    { label: '注意点',               val: item.note,      cls: 'alert-text' },
                    { label: 'アレルギー',   val: item.allergy,   cls: 'alert-text' },
                ];
            } else if (mode === 'drink') {
                fields = [
                    { label: 'グラスの種類', val: item.glass,  cls: '' },
                    { label: '分量詳細',              val: item.amount, cls: 'guide-text' },
                    { label: 'その他',                    val: item.note,   cls: 'alert-text' },
                ];
            }

            const visFields  = fields.filter(d => d.val);
            const media      = item.image ? renderMedia(item.image) : '';
            const hasDetails = visFields.length > 0 || !!media;

            const detailsHtml = hasDetails ? `
                <div class="item-details">
                    ${visFields.map(d => `
                        <div class="field">
                            <div class="field-label">${esc(d.label)}</div>
                            <div class="field-value ${d.cls}">${esc(d.val).replace(/\n/g,'<br>')}</div>
                        </div>`).join('')}
                    ${media ? `<div class="field"><div class="field-label">画像</div>${media}</div>` : ''}
                </div>` : '';

            return `
                <div class="list-item" onclick="if(this.querySelector('.item-details'))this.classList.toggle('open')">
                    <div class="item-header">
                        <div class="item-name">${esc(item.name)}</div>
                        ${item.price ? `<div class="item-price">${esc(item.price)}</div>` : ''}
                        ${hasDetails ? '<div class="arrow">&#8250;</div>' : ''}
                    </div>
                    ${detailsHtml}
                </div>`;
        }).join('');

        listEl.scrollTop = 0;
    }

    // ─── Media ─────────────────────────────────────────────

    function renderMedia(url) {
        if (!url) return '';
        const u = url.trim();

        // YouTube
        const yt = u.match(/(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/)([^&\s?#]+)/);
        if (yt) {
            const id    = yt[1];
            const embed = `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
            const thumb = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
            return `
                <div class="video-thumb" onclick="event.stopPropagation();loadVideo(this,'${embed}')">
                    <img src="${thumb}" class="video-thumb-bg" alt="">
                    <div class="play-overlay">
                        <div class="play-circle">&#9654;</div>
                        <div class="play-label">タップして再生</div>
                    </div>
                </div>`;
        }

        // Google Drive（動画・画像両対応）
        const gd = u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
        if (gd) {
            const id    = gd[1];
            const embed = `https://drive.google.com/file/d/${id}/preview`;
            const thumb = `https://drive.google.com/thumbnail?id=${id}&sz=w800`;
            return `
                <div class="video-thumb" onclick="event.stopPropagation();loadVideo(this,'${embed}')">
                    <img src="${thumb}" class="video-thumb-bg" alt="" onerror="this.style.display='none'">
                    <div class="play-overlay">
                        <div class="play-circle">&#9654;</div>
                        <div class="play-label">タップして再生</div>
                    </div>
                </div>`;
        }

        // 直接動画ファイル (.mp4 など)
        if (/\.(mp4|mov|webm|m4v)([?#]|$)/i.test(u)) {
            return `<video controls playsinline class="item-video" onclick="event.stopPropagation()">
                        <source src="${esc(u)}">
                    </video>`;
        }

        // 直接画像ファイル
        if (/\.(jpe?g|png|gif|webp|avif|bmp|svg)([?#]|$)/i.test(u)) {
            return `<img src="${esc(u)}" class="item-image" loading="lazy" onerror="this.style.display='none'">`;
        }

        // その他リンク
        return `<a href="${esc(u)}" target="_blank" rel="noopener" class="media-link">&#8599; リンクを開く</a>`;
    }

    function loadVideo(el, embedUrl) {
        el.innerHTML = `<iframe
            src="${embedUrl}"
            class="video-embed"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; picture-in-picture"
        ></iframe>`;
        el.classList.remove('video-thumb');
        el.classList.add('video-wrap');
        el.onclick = null;
        el.style.cursor = 'default';
    }

    // ─── Utils ─────────────────────────────────────────────

    function esc(s) {
        return String(s ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
</script>
</body>
</html>
