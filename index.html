<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="メニュー案内">
    <meta name="theme-color" content="#1A120D">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgZmlsbD0iIzE0MTQxNCIvPjx0ZXh0IHg9Ijk2IiB5PSI4MiIgZm9udC1zaXplPSI2MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2ZmZmZmZiI+5p2OPC90ZXh0Pjx0ZXh0IHg9Ijk2IiB5PSIxNTAiIGZvbnQtc2l6ZT0iNjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmZmZmZmYiPuaYhzwvdGV4dD48L3N2Zz4=">

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.json">

    <link rel="preconnect" href="https://www.youtube-nocookie.com">
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://docs.google.com">

    <title>メニュー案内</title>
    <style>
        /* ─── Material 3 カラートークン（ダーク） ─── */
        :root {
            --md-primary: #FFB68B;
            --md-on-primary: #522300;
            --md-primary-container: #723600;
            --md-on-primary-container: #FFDBC8;
            --md-secondary: #E5BFA8;
            --md-secondary-container: #5B4130;
            --md-on-secondary-container: #FFDBC8;
            --md-tertiary: #C9CA93;
            --md-tertiary-container: #484920;
            --md-on-tertiary-container: #E5E6AD;
            --md-error: #FFB4AB;
            --md-error-container: #93000A;
            --md-on-error-container: #FFDAD6;
            --md-surface: #1A120D;
            --md-on-surface: #F0DFD7;
            --md-on-surface-variant: #D7C2B8;
            --md-outline: #A08D84;
            --md-outline-variant: #52443C;
            --md-surface-container-lowest: #140D08;
            --md-surface-container-low: #221A15;
            --md-surface-container: #271E19;
            --md-surface-container-high: #322823;
            --md-surface-container-highest: #3D332D;

            --md-shape-s: 8px;
            --md-shape-m: 12px;
            --md-shape-l: 16px;
            --md-shape-xl: 28px;
            --md-ease: cubic-bezier(0.2, 0, 0, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            background: var(--md-surface);
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', Roboto, sans-serif;
            overflow: hidden;
            overscroll-behavior-y: none;
            color: var(--md-on-surface);
        }

        button { font: inherit; color: inherit; }

        svg.icon { width: 24px; height: 24px; fill: currentColor; flex-shrink: 0; display: block; }

        /* ステートレイヤー（押したときの薄い反応） */
        .state { position: relative; overflow: hidden; cursor: pointer; }
        .state::after {
            content: ''; position: absolute; inset: 0;
            background: currentColor; opacity: 0;
            transition: opacity 150ms var(--md-ease);
            pointer-events: none;
        }
        .state:active::after { opacity: 0.12; }

        #app {
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--md-surface);
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* ─── Top app bar ─── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 64px;
            padding: 8px 4px;
            padding-top: calc(8px + env(safe-area-inset-top));
            background: var(--md-surface);
            flex-shrink: 0;
            transition: background 200ms var(--md-ease);
        }
        .top-bar.scrolled { background: var(--md-surface-container); }

        .icon-btn {
            width: 48px; height: 48px;
            border: none; background: none;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--md-on-surface-variant);
            flex-shrink: 0;
        }
        .icon-btn.hidden { display: none; }
        #back-btn.hidden + .top-title { padding-left: 12px; }
        .icon-btn.spinning svg { animation: spin 1s linear infinite; }

        .top-title {
            flex: 1;
            font-size: 22px;
            line-height: 28px;
            font-weight: 400;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            padding: 0 4px;
            display: flex; align-items: center; gap: 8px;
        }
        .top-title span:first-child { overflow: hidden; text-overflow: ellipsis; }

        .offline-chip {
            font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
            background: var(--md-error-container);
            color: var(--md-on-error-container);
            padding: 2px 8px; border-radius: var(--md-shape-s);
            display: none; flex-shrink: 0;
        }
        .offline-chip.visible { display: inline-block; }

        /* ─── コンテンツ ─── */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 16px 24px;
            overscroll-behavior: contain;
        }

        .section-label {
            font-size: 14px; font-weight: 500; letter-spacing: 0.01em;
            color: var(--md-primary);
            padding: 16px 4px 8px;
        }

        /* M3 list（カテゴリ一覧） */
        .list {
            background: var(--md-surface-container-low);
            border-radius: var(--md-shape-l);
            overflow: hidden;
        }
        .list-row {
            display: flex; align-items: center; gap: 16px;
            min-height: 56px;
            padding: 8px 16px 8px 16px;
            border: none; background: none; width: 100%; text-align: left;
        }
        .list-row + .list-row { border-top: 1px solid var(--md-outline-variant); }
        .list-row .lead {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 500; flex-shrink: 0;
        }
        .list-row .text { flex: 1; min-width: 0; }
        .list-row .headline { font-size: 16px; line-height: 24px; color: var(--md-on-surface); }
        .list-row .supporting { font-size: 14px; line-height: 20px; color: var(--md-on-surface-variant); }
        .list-row .trail { color: var(--md-on-surface-variant); font-size: 14px; white-space: nowrap; }
        .list-row .price { color: var(--md-primary); font-size: 14px; font-weight: 500; white-space: nowrap; }

        /* 商品カード（タップで開閉） */
        .cards { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
        .card {
            background: var(--md-surface-container-low);
            border-radius: var(--md-shape-m);
            transition: background 200ms var(--md-ease);
        }
        .card.open { background: var(--md-surface-container); }
        .card-head {
            display: flex; align-items: center; gap: 12px;
            padding: 16px;
            border-radius: var(--md-shape-m);
        }
        .card-name { flex: 1; font-size: 16px; line-height: 24px; font-weight: 500; min-width: 0; }
        .price-chip {
            font-size: 14px; font-weight: 500;
            color: var(--md-on-secondary-container);
            background: var(--md-secondary-container);
            border-radius: var(--md-shape-s);
            padding: 4px 10px; white-space: nowrap; flex-shrink: 0;
        }
        .expand-icon { color: var(--md-on-surface-variant); transition: transform 250ms var(--md-ease); }
        .card.open .expand-icon { transform: rotate(180deg); }

        .card-body { display: none; padding: 0 16px 16px; }
        .card.open .card-body { display: block; animation: fade 200ms var(--md-ease); }

        .field { padding: 10px 0; border-top: 1px solid var(--md-outline-variant); }
        .field:first-child { border-top: none; padding-top: 0; }
        .field-label {
            font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em;
            color: var(--md-on-surface-variant); margin-bottom: 4px;
        }
        .field-value { font-size: 14px; line-height: 22px; color: var(--md-on-surface); }

        /* 強調フィールド（接客説明・付けるもの・注意点） */
        .callout {
            border-radius: var(--md-shape-m);
            padding: 12px; margin: 6px 0;
            border-top: none;
        }
        .callout .field-label { color: inherit; opacity: 0.85; }
        .callout .field-value { color: inherit; }
        .callout.guide     { background: var(--md-tertiary-container);  color: var(--md-on-tertiary-container); }
        .callout.condiment { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
        .callout.alert     { background: var(--md-error-container);     color: var(--md-on-error-container); }
        .callout.alert .field-value { font-weight: 700; }
        .callout + .field:not(.callout) { border-top: none; }

        /* 画像・動画 */
        .item-image {
            width: 100%; max-height: 360px; object-fit: contain;
            border-radius: var(--md-shape-m);
            display: block; background: var(--md-surface-container-lowest);
        }
        .video-thumb, .video-wrap {
            position: relative; width: 100%; padding-top: 56.25%;
            border-radius: var(--md-shape-m); overflow: hidden;
            background: var(--md-surface-container-lowest);
        }
        .video-thumb { cursor: pointer; }
        .play-overlay {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
            pointer-events: none;
        }
        .play-fab {
            width: 56px; height: 56px; border-radius: var(--md-shape-l);
            background: var(--md-primary-container); color: var(--md-on-primary-container);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 8px 3px rgba(0,0,0,.15);
        }
        .play-label { font-size: 12px; font-weight: 500; color: var(--md-on-surface-variant); letter-spacing: 0.05em; }
        .video-embed { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .item-video {
            width: 100%; max-height: 400px; display: block;
            border-radius: var(--md-shape-m); background: #000;
        }

        .text-btn {
            display: inline-flex; align-items: center; gap: 8px;
            height: 40px; padding: 0 16px 0 12px;
            border-radius: 20px;
            border: 1px solid var(--md-outline);
            color: var(--md-primary);
            font-size: 14px; font-weight: 500; text-decoration: none;
        }
        .text-btn svg { width: 18px; height: 18px; }

        .filled-btn {
            height: 40px; padding: 0 24px; border-radius: 20px; border: none;
            background: var(--md-primary); color: var(--md-on-primary);
            font-size: 14px; font-weight: 500; margin-top: 16px;
        }

        .status-msg {
            padding: 48px 24px; text-align: center;
            font-size: 14px; line-height: 22px; color: var(--md-on-surface-variant);
        }

        /* ─── Navigation bar ─── */
        .nav-bar {
            display: flex;
            background: var(--md-surface-container);
            padding-bottom: env(safe-area-inset-bottom);
            flex-shrink: 0;
        }
        .nav-item {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            padding: 12px 2px 12px; justify-content: flex-start;
            border: none; background: none;
            color: var(--md-on-surface-variant);
            cursor: pointer;
        }
        .nav-indicator {
            width: 64px; height: 32px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            transition: background 200ms var(--md-ease);
        }
        .nav-indicator::after {
            content: ''; position: absolute; inset: 0;
            background: currentColor; opacity: 0;
            transition: opacity 150ms var(--md-ease);
        }
        .nav-item:active .nav-indicator::after { opacity: 0.12; }
        .nav-label { font-size: 12px; line-height: 15px; text-align: center; font-weight: 500; letter-spacing: 0.04em; }
        .nav-item.active { color: var(--md-on-surface); }
        .nav-item.active .nav-indicator {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
        }
        .nav-item.active .nav-label { font-weight: 700; }
        .nav-label-long { font-size: 11px; letter-spacing: 0; line-height: 14px; overflow-wrap: anywhere; }
        .nav-indicator { max-width: 100%; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>

<div id="app">
    <header class="top-bar" id="top-bar">
        <button class="icon-btn state hidden" id="back-btn" aria-label="戻る">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="top-title">
            <span id="header-title-text">読み込み中...</span>
            <span id="offline-badge" class="offline-chip">オフライン</span>
        </div>
        <button class="icon-btn state" id="refresh-btn" onclick="forceRefresh()" aria-label="更新">
            <svg class="icon" viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
    </header>

    <main class="content" id="item-list">
        <div class="status-msg">データを準備しています...</div>
    </main>

    <nav class="nav-bar" id="nav-bar"></nav>
</div>

<script>
    // ─── シートの場所 ───────────────────────────────────────
    // 別の店のシートを使うときは、URL の後ろに ?sheet=シートID を付けて一度開く（端末に記憶される）
    const DEFAULT_SHEET_ID = '1yroIO2G1QG_F7J3plZYO_gdy3Y898wk6pUS3Y7lT7oU';
    const SHEET_ID = (() => {
        try {
            const q = new URLSearchParams(location.search).get('sheet');
            if (q) localStorage.setItem('menuSheetId', q);
            return localStorage.getItem('menuSheetId') || DEFAULT_SHEET_ID;
        } catch (e) { return DEFAULT_SHEET_ID; }
    })();
    const STORE = 'menu:' + SHEET_ID + ':';
    const SETTINGS_SHEET = '設定';

    function sheetUrl(name) {
        return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1`
             + `&sheet=${encodeURIComponent(name)}&t=${Date.now()}`;
    }

    // 「設定」シートが無いときに使うタブ
    const DEFAULT_TABS = [
        { sheet: 'ドリンク',                         label: 'ドリンク' },
        { sheet: 'フード',                           label: 'フード' },
        { sheet: 'ハンディーに無いもの・値段',         label: 'ハンディーに\n無いもの・値段' },
        { sheet: '接客マニュアル動画、テーブルセット', label: 'マニュアル' },
    ];

    let tabs   = DEFAULT_TABS;
    let tables = {};      // シート名 → CSV の行（1行目が見出し）
    let currentTab = '';
    let currentCat = '';

    try {
        // 旧バージョンが保存していたタブ名を引き継ぐ
        const old = { food: 'フード', drink: 'ドリンク', manual: '接客マニュアル動画、テーブルセット', other: 'ハンディーに無いもの・値段' };
        const saved = localStorage.getItem('menuLastTab') || '';
        currentTab = old[saved] || saved;
    } catch (e) {}

    function store(key, val) { try { localStorage.setItem(STORE + key, val); } catch (e) {} }
    function restore(key)    { try { return localStorage.getItem(STORE + key); } catch (e) { return null; } }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // ─── Icons ───────────────────────────────────────────────

    const ICON = {
        expand:  '<svg class="icon expand-icon" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>',
        chevron: '<svg class="icon" viewBox="0 0 24 24" style="color:var(--md-on-surface-variant)"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>',
        play:    '<svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
        open:    '<svg class="icon" viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>',
        drink:   '<svg class="icon" viewBox="0 0 24 24"><path d="M21 5V3H3v2l8 9v5H6v2h12v-2h-5v-5l8-9zM7.43 7L5.66 5h12.69l-1.78 2H7.43z"/></svg>',
        food:    '<svg class="icon" viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg>',
        list:    '<svg class="icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>',
        video:   '<svg class="icon" viewBox="0 0 24 24"><path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>',
    };

    function tabIcon(tab) {
        const s = tab.label + tab.sheet;
        if (/ドリンク|飲/.test(s))            return ICON.drink;
        if (/動画|マニュアル|接客/.test(s))    return ICON.video;
        if (/フード|料理|食/.test(s))          return ICON.food;
        return ICON.list;
    }

    // ─── Load ────────────────────────────────────────────────

    const CACHE_TTL = 10 * 60 * 1000; // 10分

    function parseTabs(text) {
        // 設定シート：A=シート名, B=タブの表示名
        const rows = parseCSV(text || '');
        if (!rows.length || (rows[0][0] || '').trim() !== 'シート名') return null;
        const list = rows.slice(1).map(r => {
            const sheet = (r[0] || '').trim();
            return { sheet, label: (r[1] || '').trim() || sheet };
        }).filter(t => t.sheet);
        return list.length ? list : null;
    }

    async function load(force = false) {
        const badgeEl    = document.getElementById('offline-badge');
        const refreshBtn = document.getElementById('refresh-btn');

        // キャッシュからすぐ表示
        tabs = parseTabs(restore('tabs')) || DEFAULT_TABS;
        let hasCached = false;
        for (const t of tabs) {
            const c = restore('sheet:' + t.sheet);
            if (c) { tables[t.sheet] = parseCSV(c); hasCached = true; }
        }
        renderNav();
        if (hasCached) renderCurrent();

        // キャッシュが新鮮なら通信しない（10分以内）
        const lastFetch = parseInt(restore('lastFetch') || '0');
        if (!force && hasCached && Date.now() - lastFetch < CACHE_TTL) {
            badgeEl.classList.remove('visible');
            return;
        }

        // バックグラウンドで最新データを取得
        if (refreshBtn) refreshBtn.classList.add('spinning');

        let networkError = false;
        const fetchText  = url => fetch(url).then(r => { if (!r.ok) throw new Error(); return r.text(); });
        const fetchSheet = name => fetchText(sheetUrl(name))
            .then(text => { store('sheet:' + name, text); tables[name] = parseCSV(text); })
            .catch(() => { networkError = true; });

        // 設定シートと、いま分かっているタブを同時に取りに行き、増えたタブはあとから取る
        const started = new Set(tabs.map(t => t.sheet));
        const first   = tabs.map(t => fetchSheet(t.sheet));
        await fetchText(sheetUrl(SETTINGS_SHEET))
            .then(text => {
                const parsed = parseTabs(text);
                tabs = parsed || DEFAULT_TABS;
                store('tabs', parsed ? text : '');
            })
            .catch(() => { networkError = true; });
        const more = tabs.filter(t => !started.has(t.sheet)).map(t => fetchSheet(t.sheet));
        await Promise.all([...first, ...more]);

        if (refreshBtn) refreshBtn.classList.remove('spinning');

        if (networkError) {
            if (!hasCached) {
                document.getElementById('item-list').innerHTML =
                    `<div class="status-msg">通信エラー。<br>初回はWi-Fi環境で開いてください。<br><button class="filled-btn state" onclick="load(true)">再試行</button></div>`;
                document.getElementById('header-title-text').textContent = 'エラー';
                return;
            }
            badgeEl.classList.add('visible');
        } else {
            store('lastFetch', Date.now().toString());
            badgeEl.classList.remove('visible');
        }

        renderNav();
        renderCurrent();
    }

    function forceRefresh() {
        load(true).then(precacheVideos);
    }

    // ─── 見出し行の読み取り ─────────────────────────────────
    // 列の位置ではなく1行目の見出しの名前で読むので、列の追加・並べ替え・名前の変更がそのまま反映される。
    //   カテゴリ／分類 … 一覧のグループ分け
    //   値段／価格／料金／金額 … 右上の値段
    //   それ以外で一番左の列 … カードの見出し（商品名など）
    //   残りの列 … 見出しの名前をそのまま項目名にして表示。# で始まる見出しの列は表示しない
    // 見出しの2行目以降（セル内改行）は店長向けのメモとして表示しない。

    const RE_CAT   = /^(カテゴリ|カテゴリー|分類)$/;
    const RE_PRICE = /値段|価格|料金|金額/;
    const RE_MEDIA = /画像|動画|写真/;

    function analyzeColumns(headers) {
        const cols = headers.map((h, i) => ({
            i, label: (h || '').trim().split('\n')[0].trim().replace(/[。．]$/, ''),
        })).filter(c => c.label && !/^[#＃]/.test(c.label));

        let cat     = cols.find(c => RE_CAT.test(c.label));
        const price = cols.find(c => c !== cat && RE_PRICE.test(c.label));
        const rest  = cols.filter(c => c !== cat && c !== price);
        let title   = rest.find(c => !RE_MEDIA.test(c.label));
        // 「カテゴリ」と動画だけのシートは、カテゴリ列をそのまま見出しにする
        if (!title && cat) { title = cat; cat = null; }
        if (!title) return null;

        return { cat, title, price, fields: rest.filter(c => c !== title) };
    }

    // 見出しの名前で強調の色を決める
    function fieldStyle(label) {
        if (/注意|アレルギー|その他/.test(label))     return 'alert';
        if (/接客|トーク|声かけ|分量/.test(label))    return 'guide';
        if (/付ける|つける|タレ|薬味/.test(label))     return 'condiment';
        return '';
    }

    function buildView(sheet) {
        const rows = tables[sheet];
        if (!rows || !rows.length) return null;
        const a = analyzeColumns(rows[0]);
        if (!a) return { missing: true };

        let lastCat = '';
        const items = rows.slice(1).map(r => {
            if (a.cat && r[a.cat.i]) lastCat = r[a.cat.i];
            return { cat: lastCat, row: r };
        }).filter(it => (it.row[a.title.i] || '').trim());
        const cats = a.cat ? [...new Set(items.map(it => it.cat).filter(Boolean))] : [];
        return { a, items, cats };
    }

    function parseCSV(text) {
        const rows = [];
        let row = [], cell = '', q = false;
        for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (q) {
                if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; }
                else cell += c;
            } else {
                if (c === '"') q = true;
                else if (c === ',') { row.push(cell.trim()); cell = ''; }
                else if (c === '\n' || c === '\r') {
                    if (c === '\r' && text[i+1] === '\n') i++;
                    row.push(cell.trim()); rows.push(row); row = []; cell = '';
                } else cell += c;
            }
        }
        if (row.length) { row.push(cell.trim()); rows.push(row); }
        return rows;
    }

    // ─── Header / Nav ───────────────────────────────────────

    function setHeader(title, backFn) {
        const backBtn = document.getElementById('back-btn');
        document.getElementById('header-title-text').textContent = title;
        if (backFn) {
            backBtn.classList.remove('hidden');
            backBtn.onclick = backFn;
        } else {
            backBtn.classList.add('hidden');
            backBtn.onclick = null;
        }
    }

    function renderNav() {
        document.getElementById('nav-bar').innerHTML = tabs.map((t, i) => {
            const long = t.label.replace(/\n/g, '').length > 5;
            return `
                <button class="nav-item" data-idx="${i}" onclick="goTab(${i})">
                    <span class="nav-indicator">${tabIcon(t)}</span>
                    <span class="nav-label ${long ? 'nav-label-long' : ''}">${esc(t.label).replace(/\n/g, '<br>')}</span>
                </button>`;
        }).join('');
        setNav();
    }

    function setNav() {
        document.querySelectorAll('.nav-item').forEach(el =>
            el.classList.toggle('active', (tabs[el.dataset.idx] || {}).sheet === currentTab));
        try { localStorage.setItem('menuLastTab', currentTab); } catch (e) {}
    }

    function goTab(i) {
        currentTab = tabs[i].sheet;
        currentCat = '';
        renderTab();
    }

    function setContent(html) {
        const listEl = document.getElementById('item-list');
        listEl.innerHTML = html;
        listEl.scrollTop = 0;
        document.getElementById('top-bar').classList.remove('scrolled');
    }

    document.getElementById('item-list').addEventListener('scroll', e => {
        document.getElementById('top-bar').classList.toggle('scrolled', e.target.scrollTop > 4);
    }, { passive: true });

    function toggleCard(el) {
        const card = el.closest('.card');
        if (card && card.querySelector('.card-body')) card.classList.toggle('open');
    }

    // ─── タブ → （カテゴリ →）カード ─────────────────────────

    function renderCurrent() {
        if (!tabs.some(t => t.sheet === currentTab)) currentTab = (tabs[0] || {}).sheet || '';
        const view = buildView(currentTab);
        if (currentCat && view && view.cats && view.cats.includes(currentCat)) renderItems(currentCat);
        else renderTab();
    }

    function renderTab() {
        currentCat = '';
        const tab = tabs.find(t => t.sheet === currentTab) || { sheet: currentTab, label: currentTab };
        setNav();
        setHeader(tab.label.replace(/\n/g, ''), null);

        const view = buildView(currentTab);
        if (view && view.missing) {
            setContent(`<div class="status-msg">シート「${esc(currentTab)}」が見つからないか、1行目に見出しがありません。<br>「設定」シートのシート名を確認してください。</div>`);
            return;
        }
        if (!view || view.items.length === 0) {
            setContent(`<div class="status-msg">データがありません</div>`);
            return;
        }

        if (!view.cats.length) {
            setContent(cardsHtml(view.items, view.a));
            return;
        }

        window._cats = view.cats;
        setContent(`<div class="list" style="margin-top:4px">` + view.cats.map((cat, i) => {
            const count = view.items.filter(it => it.cat === cat).length;
            return `
                <button class="list-row state" onclick="renderItems(window._cats[${i}])">
                    <div class="lead">${esc([...cat][0] || '')}</div>
                    <div class="text"><div class="headline">${esc(cat)}</div></div>
                    <div class="trail">${count}品</div>
                    ${ICON.chevron}
                </button>`;
        }).join('') + `</div>`);
    }

    function renderItems(cat) {
        const view = buildView(currentTab);
        if (!view || !view.cats) return;
        currentCat = cat;
        setNav();
        setHeader(cat, renderTab);
        setContent(cardsHtml(view.items.filter(it => it.cat === cat), view.a));
    }

    function cardsHtml(items, a) {
        return `<div class="cards">` + items.map(({ row }) => {
            const name   = row[a.title.i] || '';
            const price  = a.price ? (row[a.price.i] || '') : '';
            const fields = a.fields
                .map(c => ({ label: c.label, val: (row[c.i] || '').trim() }))
                .filter(f => f.val);
            const body = fields.map(f => fieldHtml(f, fields.length === 1)).join('');
            return `
                <div class="card">
                    <div class="card-head ${body ? 'state' : ''}" onclick="toggleCard(this)">
                        <div class="card-name">${esc(name)}</div>
                        ${price ? `<div class="price-chip">${esc(price)}</div>` : ''}
                        ${body ? ICON.expand : ''}
                    </div>
                    ${body ? `<div class="card-body">${body}</div>` : ''}
                </div>`;
        }).join('') + `</div>`;
    }

    function fieldHtml(f, only) {
        if (isMediaValue(f.val)) {
            const media = renderMedia(f.val);
            return only ? media : `<div class="field"><div class="field-label">${esc(f.label)}</div>${media}</div>`;
        }
        const cls = fieldStyle(f.label);
        return `
            <div class="field ${cls ? 'callout ' + cls : ''}">
                <div class="field-label">${esc(f.label)}</div>
                <div class="field-value">${esc(f.val).replace(/\n/g, '<br>')}</div>
            </div>`;
    }

    function isMediaValue(v) {
        return /^https?:\/\//i.test(v) || !!localVideoPath(v) || /\.(jpe?g|png|gif|webp|avif|bmp|svg)$/i.test(v);
    }

    // ─── Media ─────────────────────────────────────────────

    function renderMedia(url) {
        if (!url) return '';
        const u = url.trim();

        // YouTube
        const yt = u.match(/(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/)([^&\s?#]+)/);
        if (yt) {
            const id    = yt[1];
            const embed = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1`;
            return videoThumb(embed, 'YouTube ・ タップして再生');
        }

        // Google Drive（動画・画像両対応）
        const gd = u.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
        if (gd) {
            const id    = gd[1];
            const embed = `https://drive.google.com/file/d/${id}/preview`;
            return videoThumb(embed, 'Drive ・ タップして再生');
        }

        // アプリ内の動画（videos/ フォルダ。端末に保存済みならオフラインでも再生）
        const local = localVideoPath(u);
        if (local) {
            return `<video controls playsinline preload="metadata" class="item-video" onclick="event.stopPropagation()"
                        src="${esc(encodeURI(local))}"></video>`;
        }

        // 直接動画ファイル (.mp4 など)
        if (/\.(mp4|mov|webm|m4v)([?#]|$)/i.test(u)) {
            return `<video controls playsinline class="item-video" onclick="event.stopPropagation()">
                        <source src="${esc(u)}">
                    </video>`;
        }

        // 直接画像ファイル
        if (/\.(jpe?g|png|gif|webp|avif|bmp|svg)([?#]|$)/i.test(u)) {
            return `<img src="${esc(u)}" class="item-image" loading="lazy" onerror="this.style.display='none'">`;
        }

        // その他リンク
        return `<a href="${esc(u)}" target="_blank" rel="noopener" class="text-btn state" onclick="event.stopPropagation()">${ICON.open}リンクを開く</a>`;
    }

    function videoThumb(embed, label) {
        return `
            <div class="video-thumb" onclick="event.stopPropagation();loadVideo(this,'${embed}')">
                <div class="play-overlay">
                    <div class="play-fab">${ICON.play}</div>
                    <div class="play-label">${label}</div>
                </div>
            </div>`;
    }

    function loadVideo(el, embedUrl) {
        el.innerHTML = `<iframe
            src="${embedUrl}"
            class="video-embed"
            allowfullscreen
            webkitallowfullscreen
            mozallowfullscreen
            allow="autoplay; fullscreen; picture-in-picture"
        ></iframe>`;
        el.classList.remove('video-thumb');
        el.classList.add('video-wrap');
        el.onclick = null;
        el.style.cursor = 'default';
    }

    // ─── 動画の端末保存 ─────────────────────────────────────
    // シートに「お出迎え.mp4」や「videos/お出迎え.mp4」と書くと videos/ の動画を使う。
    // 起動時に裏でダウンロードして端末に保存し、以後は通信なしで再生する。

    const VIDEO_CACHE = 'menu-videos';

    function localVideoPath(u) {
        if (!u || /^[a-z]+:/i.test(u) || !/\.(mp4|webm|m4v|mov)$/i.test(u)) return null;
        const p = u.replace(/^\.?\//, '');
        return p.includes('/') ? p : 'videos/' + p;
    }

    async function precacheVideos() {
        if (!('caches' in window)) return;
        const urls = [...new Set(
            Object.values(tables)
                .flatMap(rows => rows.slice(1).flat())
                .map(localVideoPath)
                .filter(Boolean)
                .map(p => new URL(encodeURI(p), location.href).href)
        )];
        try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

        const cache = await caches.open(VIDEO_CACHE);
        // シートから消えた動画は端末からも消す
        for (const req of await cache.keys()) {
            if (!urls.includes(req.url)) await cache.delete(req);
        }
        // 回線が遅くても詰まらないよう1本ずつ
        for (const url of urls) {
            if (await cache.match(url)) continue;
            try {
                const res = await fetch(url);
                if (res.status === 200) await cache.put(url, res);
            } catch (e) {}
        }
    }

    // ─── Utils ─────────────────────────────────────────────

    function esc(s) {
        return String(s ?? '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load().then(precacheVideos);
</script>
</body>
</html>
